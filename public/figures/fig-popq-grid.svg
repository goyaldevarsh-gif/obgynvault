<text x='636' y='153' font-size='24' font-weight='800' fill='#102A43'>Aa</text>
<text x='700' y='153' font-size='22' fill='#102A43'>anterior wall, 3 cm in from the urethral meatus</text>
<rect x='620' y='178' width='830' height='48' rx='10' fill='#EEF6F8'/>
<text x='636' y='211' font-size='24' font-weight='800' fill='#102A43'>Ba</text>
<text x='700' y='211' font-size='22' fill='#102A43'>most dependent point of the upper anterior wall</text>
<rect x='620' y='236' width='830' height='48' rx='10' fill='#EEF6F8'/>
<text x='636' y='269' font-size='24' font-weight='800' fill='#102A43'>C</text>
<text x='700' y='269' font-size='22' fill='#102A43'>cervix or vaginal vault</text>
