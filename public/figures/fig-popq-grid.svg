<text x='636' y='327' font-size='24' font-weight='800' fill='#102A43'>D</text>
<text x='700' y='327' font-size='22' fill='#102A43'>posterior fornix (omit after hysterectomy)</text>
<rect x='620' y='352' width='830' height='48' rx='10' fill='#EEF6F8'/>
<text x='636' y='385' font-size='24' font-weight='800' fill='#102A43'>Ap</text>
<text x='700' y='385' font-size='22' fill='#102A43'>posterior wall, 3 cm above the hymen</text>
