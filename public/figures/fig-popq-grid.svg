<text x='636' y='443' font-size='24' font-weight='800' fill='#102A43'>Bp</text>
<text x='700' y='443' font-size='22' fill='#102A43'>most dependent point of the upper posterior wall</text>
<rect x='620' y='468' width='830' height='48' rx='10' fill='#EEF6F8'/>
<text x='636' y='501' font-size='24' font-weight='800' fill='#102A43'>gh</text>
<text x='700' y='501' font-size='22' fill='#102A43'>genital hiatus: mid urethral meatus to posterior hymen</text>
<rect x='620' y='526' width='830' height='48' rx='10' fill='#EEF6F8'/>
<text x='636' y='559' font-size='24' font-weight='800' fill='#102A43'>pb</text>
<text x='700' y='559' font-size='22' fill='#102A43'>perineal body: posterior hymen to mid anal opening</text>
<rect x='620' y='584' width='830' height='48' rx='10' fill='#EEF6F8'/>
<text x='636' y='617' font-size='24' font-weight='800' fill='#102A43'>tvl</text>
<text x='700' y='617' font-size='22' fill='#102A43'>total vaginal length</text>
<rect x='50' y='740' width='1400' height='70' rx='14' fill='#E6F6F4' stroke='#20A69A' stroke-width='2.5'/>
<text x='750' y='785' text-anchor='middle' font-size='26' font-weight='700' fill='#102A43'>Hymen = 0. Above the hymen = negative (−). Below the hymen = positive (+).</text>
