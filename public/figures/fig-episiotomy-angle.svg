<text x='600' y='682' text-anchor='middle' font-size='22' font-weight='700' fill='#102A43'>Start at the fourchette, cut 60° from the midline at crowning (NICE: 45–60°).</text>
<text x='600' y='710' text-anchor='middle' font-size='20' fill='#102A43'>Effective analgesia first, except in an emergency.</text>
