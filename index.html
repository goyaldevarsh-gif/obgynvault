    <title>ObGynVault</title>
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 80% at 50% 30%,#1b3a57 0%,#102a43 60%,#0b1f33 100%);color:#fff;font-family:Manrope,Inter,system-ui,sans-serif;transition:opacity .45s ease,visibility .45s ease}
      #splash.hide{opacity:0;visibility:hidden}
      #splash svg{width:96px;height:96px;animation:sp-in .7s cubic-bezier(.2,.8,.2,1) both,sp-pulse 2.4s ease-in-out .7s infinite}
      #splash .wm{font-size:28px;font-weight:800;letter-spacing:-.02em;animation:sp-up .6s .25s both}
      #splash .wm b{color:#20a69a;font-weight:800}
      #splash .tag{font-size:13px;font-weight:600;color:#9fb3c8;letter-spacing:.04em;animation:sp-up .6s .4s both}
      #splash .bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px;animation:sp-up .6s .5s both}
      #splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#20a69a,#e5a34c);animation:sp-load 1.1s ease-in-out infinite}
      @keyframes sp-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
      @keyframes sp-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes sp-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      @keyframes sp-load{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
    </style>
  </head>
  <body>

      <div class="wm">ObGyn<b>Vault</b></div>
